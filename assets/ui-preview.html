te-columns:1fr 1fr}.checks{grid-template-columns:1fr 1fr}}

</head>
<body><main class="wrap"><section class="card">

  <div class="diag"><span><span class="ok">●</span> PDO MySQL · ZipArchive · SEO URL</span><span data-t="readonly"></span></div>
